---
- name: Mettre à jour les listes Pi-hole
  hosts: pihole
  become: true
  gather_facts: false

  tasks:
    - name: Mettre à jour Gravity
      ansible.builtin.command:
        cmd: pihole -g
      register: pihole_update
      changed_when: true

    - name: Afficher le résultat
      ansible.builtin.debug:
        var: pihole_update.stdout_lines
