```yaml
---
- name: Mettre à jour les listes Pi-hole
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Mettre à jour Gravity
      ansible.builtin.command:
        cmd: pihole -g
      register: pihole_update
      changed_when: "'List has been updated' in pihole_update.stdout"

    - name: Afficher le résumé
      ansible.builtin.debug:
        msg:
          - "DNS : {{ 'OK' if 'DNS resolution is available' in pihole_update.stdout else 'ERREUR' }}"
          - "Listes modifiées : {{ 'Oui' if 'List has been updated' in pihole_update.stdout else 'Non' }}"

    - name: Afficher la sortie complète de Pi-hole
      ansible.builtin.debug:
        var: pihole_update.stdout_lines
```
