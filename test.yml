---
- name: Mise à jour complète des LXC
  hosts: all
  serial: 1
  become: false
  gather_facts: true

  tasks:

    # ============================================================
    # INFORMATIONS
    # ============================================================

    - name: Afficher le serveur
      ansible.builtin.debug:
        msg: "Mise à jour de {{ ansible_hostname }} ({{ inventory_hostname }})"


    # ============================================================
    # AVANT MISE À JOUR
    # ============================================================

    - name: Mettre à jour le cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Lister les paquets pouvant être mis à jour
      ansible.builtin.shell:
        cmd: apt list --upgradable 2>/dev/null
      register: updates_before
      changed_when: false

    - name: Afficher les mises à jour disponibles
      ansible.builtin.debug:
        msg: "{{ updates_before.stdout_lines }}"


    # ============================================================
    # MISE À JOUR
    # ============================================================

    - name: Mettre à niveau tous les paquets
      ansible.builtin.apt:
        upgrade: dist

    - name: Supprimer les paquets devenus inutiles
      ansible.builtin.apt:
        autoremove: true

    - name: Nettoyer le cache APT
      ansible.builtin.apt:
        autoclean: true


    # ============================================================
    # VÉRIFICATION APRÈS MISE À JOUR
    # ============================================================

    - name: Vérifier le cache APT après mise à jour
      ansible.builtin.apt:
        update_cache: true

    - name: Vérifier les mises à jour restantes
      ansible.builtin.shell:
        cmd: apt list --upgradable 2>/dev/null
      register: updates_after
      changed_when: false

    - name: Afficher les mises à jour restantes
      ansible.builtin.debug:
        msg: "{{ updates_after.stdout_lines }}"


    # ============================================================
    # RÉSULTAT
    # ============================================================

    - name: Afficher le résultat final
      ansible.builtin.debug:
        msg: >-
          Mise à jour terminée pour {{ ansible_hostname }}.
          Vérification effectuée, aucun redémarrage demandé par Ansible.



      - name: Envoyer la notification Discord
        ansible.builtin.uri:
          url: "{{ discord_webhook_url }}"
          method: POST
          body_format: json
          body:
            username: "Ansible Updates"
            content: "✅ Mise à jour terminée sur {{ ansible_hostname }}"
          status_code: 204
