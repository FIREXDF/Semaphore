---
- name: Vérifier les mises à jour disponibles
  hosts: all
  become: false
  gather_facts: false

  tasks:
    - name: Mettre à jour le cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Afficher les paquets pouvant être mis à jour
      ansible.builtin.shell: apt list --upgradable 2>/dev/null
      register: updates
      changed_when: false

    - name: Afficher les mises à jour
      ansible.builtin.debug:
        var: updates.stdout_lines
