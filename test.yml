    - name: Envoyer la notification Discord
      ansible.builtin.uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          username: "Ansible Updates"
          embeds:
            - title: "Ansible Update"
              description: "Mise à jour automatique des LXC terminée."
              color: >-
                {{
                  3066993
                  if total_after | int == 0
                  else 15105570
                }}
              fields: "{{ discord_fields + [
                {
                  'name': 'Résumé',
                  'value': '📦 ' ~ (total_done | string) ~ ' paquet(s) mis à jour | ⚠️ ' ~ (total_after | string) ~ ' mise(s) à jour restante(s) | 🖥️ ' ~ (total_hosts | string) ~ ' LXC traité(s)',
                  'inline': false
                }
              ] }}"
              footer:
                text: "Ansible • Mise à jour automatique"
        status_code: 204
