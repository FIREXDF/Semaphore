# ============================================================
# NOTIFICATION DISCORD
# ============================================================

- name: Envoyer le résumé Discord
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ============================================================
    # CONSTRUCTION DES FIELDS
    # ============================================================

    - name: Construire les champs Discord
      ansible.builtin.set_fact:
        discord_fields: >-
          {{
            discord_fields | default([]) +
            [
              {
                "name": (
                  "🟢 " ~ hostvars[host].ansible_hostname
                  if hostvars[host].updates_after_count | int == 0
                  else
                  "🔵 " ~ hostvars[host].ansible_hostname
                  if hostvars[host].updates_before_count | int == 0
                  else
                  "🟠 " ~ hostvars[host].ansible_hostname
                ),
                "value":
                  "📦 **" ~ (hostvars[host].updates_done_count | string) ~ "** paquet(s) mis à jour\n"
                  ~ "⚠️ **" ~ (hostvars[host].updates_after_count | string) ~ "** restante(s)",
                "inline": true
              }
            ]
          }}
      loop: "{{ groups['all'] }}"
      when: hostvars[host].updates_before_count is defined
      loop_control:
        loop_var: host


    # ============================================================
    # CALCUL DU RÉSUMÉ GLOBAL
    # ============================================================

    - name: Calculer le résumé global
      ansible.builtin.set_fact:
        total_done: >-
          {{
            groups['all']
            | map('extract', hostvars, 'updates_done_count')
            | map('default', 0)
            | map('int')
            | sum
          }}

        total_after: >-
          {{
            groups['all']
            | map('extract', hostvars, 'updates_after_count')
            | map('default', 0)
            | map('int')
            | sum
          }}


    # ============================================================
    # ENVOI DISCORD
    # ============================================================

    - name: Envoyer la notification Discord
      ansible.builtin.uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          username: "Ansible Updates"

          embeds:
            - title: "Ansible Update"
              description: "Mise à jour automatique des LXC terminée."
              fields: "{{ discord_fields }}"
              color: >-
                {{
                  3066993
                  if total_after | int == 0
                  else 15105570
                }}
              footer:
                text: "Ansible • Mise à jour automatique"

        status_code: 204
